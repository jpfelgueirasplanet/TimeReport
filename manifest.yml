modules:
  # A global page puts the app inside Jira's own navigation chrome and adds an
  # entry to the "Apps" menu in the top navigation bar, so it looks and feels
  # like a native Jira screen. (A jira:fullPage module renders standalone with
  # no Jira navigation at all.)
  jira:globalPage:
    - key: time-report-global-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Time Report
      # `native` renders the page with Jira's default page controls (title bar,
      # spacing and theming), so the app blends into the product chrome.
      layout: native
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/f8b1d7a6-1f96-4963-a900-47d47a44b1c6
permissions:
  scopes:
    # Needed to read saved filters, search issues and read worklogs as the
    # logged in user. `read:jira-user` lets us show worklog author display names.
    - read:jira-work
    - read:jira-user

